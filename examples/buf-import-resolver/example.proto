syntax = "proto3";

package example;

// This import should be resolved from Buf Schema Registry
import "buf/validate/validate.proto";

// Example user message with validation rules from buf/validate
message User {
  // ID must be a valid UUID
  string id = 1 [(buf.validate.field).string.uuid = true];
  
  // Username must be between 3 and 20 characters
  string username = 2 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 20,
    (buf.validate.field).string.pattern = "^[a-zA-Z0-9_]+$"
  ];
  
  // Email must be a valid email address
  string email = 3 [(buf.validate.field).string.email = true];
  
  // Age must be between 18 and 120
  int32 age = 4 [
    (buf.validate.field).int32.gte = 18,
    (buf.validate.field).int32.lte = 120
  ];
  
  // Status must be one of the defined enum values
  UserStatus status = 5 [(buf.validate.field).enum.defined_only = true];
  
  // Created timestamp must be in the past
  int64 created_at = 6 [(buf.validate.field).int64.lt_now = true];
  
  // Optional profile
  UserProfile profile = 7;
  
  // Tags must have unique values and max 10 items
  repeated string tags = 8 [
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.max_items = 10
  ];
}

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_INACTIVE = 2;
  USER_STATUS_BANNED = 3;
}

message UserProfile {
  // Bio must be less than 500 characters
  string bio = 1 [(buf.validate.field).string.max_len = 500];
  
  // Website must be a valid URL if provided
  string website = 2 [(buf.validate.field).string.uri = true];
  
  // Phone number with E.164 format validation
  string phone = 3 [(buf.validate.field).string.pattern = "^\\+[1-9]\\d{1,14}$"];
}

// Service with validation on request/response
service UserService {
  rpc CreateUser(CreateUserRequest) returns (User);
  rpc GetUser(GetUserRequest) returns (User);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
}

message CreateUserRequest {
  // User to create with all validation rules applied
  User user = 1 [(buf.validate.field).required = true];
}

message GetUserRequest {
  // User ID must be a valid UUID
  string user_id = 1 [(buf.validate.field).string.uuid = true];
}

message ListUsersRequest {
  // Page size must be between 1 and 100
  int32 page_size = 1 [
    (buf.validate.field).int32.gte = 1,
    (buf.validate.field).int32.lte = 100
  ];
  
  // Page token for pagination
  string page_token = 2;
}

message ListUsersResponse {
  // List of users
  repeated User users = 1;
  
  // Next page token
  string next_page_token = 2;
}
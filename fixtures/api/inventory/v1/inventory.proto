syntax = "proto3";

package api.inventory.v1;

import "api/common/v1/types.proto";
import "api/user/v1/user.proto";
import "google/protobuf/timestamp.proto";

// Product categories
enum Category {
  CATEGORY_UNSPECIFIED = 0;
  ELECTRONICS = 1;
  CLOTHING = 2;
  BOOKS = 3;
  HOME_GARDEN = 4;
  SPORTS = 5;
}

// Product condition
enum Condition {
  CONDITION_UNSPECIFIED = 0;
  NEW = 1;
  USED = 2;
  REFURBISHED = 3;
  DAMAGED = 4;
}

// Product message
message Product {
  string id = 1;
  string name = 2;
  string description = 3;
  string sku = 4;
  Category category = 5;
  api.common.v1.Money price = 6;
  Condition condition = 7;
  api.common.v1.Metadata metadata = 8;

  // Product dimensions
  message Dimensions {
    double length = 1;
    double width = 2;
    double height = 3;
    string unit = 4;
  }

  Dimensions dimensions = 9;
  double weight = 10;
  repeated string image_urls = 11;
  map<string, string> attributes = 12;
}

// Inventory item
message InventoryItem {
  string id = 1;
  Product product = 2;
  string warehouse_id = 3;
  int32 quantity_available = 4;
  int32 quantity_reserved = 5;
  int32 reorder_point = 6;
  api.common.v1.Status status = 7;
  google.protobuf.Timestamp last_updated = 8;
}

// Stock movement record
message StockMovement {
  string id = 1;
  string inventory_item_id = 2;
  int32 quantity_change = 3;
  MovementType type = 4;
  string reference_id = 5;
  string notes = 6;
  api.user.v1.User created_by = 7;
  google.protobuf.Timestamp created_at = 8;

  enum MovementType {
    MOVEMENT_TYPE_UNSPECIFIED = 0;
    PURCHASE = 1;
    SALE = 2;
    ADJUSTMENT = 3;
    TRANSFER = 4;
    RETURN = 5;
  }
}

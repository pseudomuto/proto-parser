syntax = "proto3";

package api.user.v1;

import "api/common/v1/types.proto";
import "google/protobuf/timestamp.proto";

// User message with nested address and oneofs to match original test coverage
message User {
  int32 id = 1;
  string name = 2;
  string email = 3;
  api.common.v1.Status status = 4;
  google.protobuf.Timestamp created_at = 5;

  // Nested message for addresses (matches original test coverage)
  message Address {
    string street = 1;
    string city = 2;
    string country = 3;
  }

  repeated Address addresses = 6;

  // Oneof for contact methods (matches original test coverage)
  oneof contact {
    string phone = 7;
    string mobile = 8;
  }

  api.common.v1.Metadata metadata = 9;

  // User profile information
  message Profile {
    string display_name = 1;
    string bio = 2;
    string avatar_url = 3;
    map<string, string> preferences = 4;
  }

  Profile profile = 10;
}

// Authentication information
message AuthInfo {
  string provider = 1;
  string external_id = 2;
  google.protobuf.Timestamp last_login = 3;
  bool email_verified = 4;
}
